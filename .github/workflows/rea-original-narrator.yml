name: REA original narrator audition (zero-cost public runner)
on:
  push:
    branches: [rea-voice-audition-20261103]
    paths: [.github/workflows/rea-original-narrator.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rea-original-narrator-audition
  cancel-in-progress: true

jobs:
  synthesize-original-narrator:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install open-source speech runtime (on ephemeral runner only)
        run: |
          python -m pip install --disable-pip-version-check -q kokoro-onnx soundfile numpy
      - name: Retrieve openly licensed Kokoro model
        run: |
          set -euxo pipefail
          curl -fL --retry 2 --max-time 240 -o kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          curl -fL --retry 2 --max-time 120 -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          test "$(stat -c%s kokoro-v1.0.onnx)" -gt 50000000
          test "$(stat -c%s voices-v1.0.bin)" -gt 1000000
      - name: Synthesize two ORIGINAL American action documentary voices
        run: |
          mkdir -p out
          python - <<'PY'
          from kokoro_onnx import Kokoro
          import numpy as np, soundfile as sf, json, hashlib
          from pathlib import Path
          text="Looks like a routine delivery. Until this little truck catches the eye of the law."
          model=Kokoro("kokoro-v1.0.onnx","voices-v1.0.bin")
          report={'source':'Kokoro v1.0 open weights (Apache 2.0)', 'engine':'kokoro-onnx (MIT)', 'prompt':text,'cue_id':'20274_01','allowed_window_s':7.0,'original_narrator':True,'cloned_specific_person':False,'candidates':[]}
          for voice in ['am_onyx','am_michael']:
              audio,sr=model.create(text,voice=voice,speed=1.12,lang='en-us')
              audio=np.asarray(audio,dtype=np.float32).ravel()
              if len(audio)<sr or not np.all(np.isfinite(audio)) or float(np.max(np.abs(audio)))<0.01: raise RuntimeError('Audio validation failed: '+voice)
              path=Path('out')/f'20274_01_{voice}_KOKORO_AUDITION.wav'
              sf.write(str(path),audio,int(sr),subtype='PCM_16')
              report['candidates'].append({'voice':voice,'sample_rate':int(sr),'duration_s':round(len(audio)/sr,3),'file':path.name,'sha256':hashlib.sha256(path.read_bytes()).hexdigest()})
          Path('out/AUDITION_REPORT.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - name: Upload audition WAV files and checksums
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rea-original-narrator-audition-20274-01
          path: out/
          retention-days: 1
          if-no-files-found: error
